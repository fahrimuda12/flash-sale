# ============================================================================
# Spring Profile: Local Development (Audit Service)
# ============================================================================
spring.application.name=audit
server.port=8083

# MongoDB NoSQL Configuration (Localhost)
spring.data.mongodb.uri=mongodb://localhost:27017/audit
spring.data.mongodb.auto-index-creation=true

# Kafka Broker & Consumer Configuration (Localhost)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=audit-service-dev-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Topics
app.kafka.topics.audit-events=flashsale.audit.events
app.kafka.topics.order-events=flashsale-order-events
app.kafka.topics.product-events=flashsale-product-events

# Dynamic Java Audit Seeder for Local Development
app.seeder.audit.enabled=true
app.seeder.audit.count=50

# Development Logging Levels (Detailed debugging output)
logging.level.root=INFO
logging.level.com.fahri.audit=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb=DEBUG
