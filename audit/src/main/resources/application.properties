spring.application.name=audit
spring.profiles.active=dev
server.port=8083

# MongoDB NoSQL Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/audit
spring.data.mongodb.auto-index-creation=true

# Kafka Broker & Consumer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=audit-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Topics
app.kafka.topics.audit-events=flashsale.audit.events
app.kafka.topics.order-events=flashsale-order-events
app.kafka.topics.product-events=flashsale-product-events

# Dynamic Java Audit Seeder (Boundary: 1 to 500)
app.seeder.audit.enabled=true
app.seeder.audit.count=100
