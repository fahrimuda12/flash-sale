# ============================================================================
# Spring Profile: Production Deployment (Audit Service)
# ============================================================================
spring.application.name=audit
server.port=8083

# MongoDB NoSQL Configuration for Docker / Deployment
spring.data.mongodb.uri=mongodb://${MONGO_HOST:mongodb}:27017/audit
spring.data.mongodb.auto-index-creation=true

# Kafka Broker & Consumer Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=audit-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Kafka Topics
app.kafka.topics.audit-events=flashsale.audit.events
app.kafka.topics.order-events=flashsale-order-events
app.kafka.topics.product-events=flashsale-product-events

# Audit Seeder Disabled in Production by Default
app.seeder.audit.enabled=false
app.seeder.audit.count=0

# Logging Levels for Deployment
logging.level.root=INFO
logging.level.com.fahri.audit=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.data.mongodb=WARN
