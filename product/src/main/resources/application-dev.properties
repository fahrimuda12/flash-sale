# ============================================================================
# Spring Profile: Local Development (Product Service)
# ============================================================================
spring.application.name=product
server.port=8081

# Disable Docker Compose auto-connection override
spring.docker.compose.enabled=false

# PostgreSQL Configuration (Localhost)
spring.datasource.url=jdbc:postgresql://localhost:5432/product
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Lightweight for local development)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA & Hibernate Settings (Verbose SQL formatting for development debugging)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Database Migration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public

# Redis Configuration (Localhost Data Grid & Cache)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Kafka Broker Configuration (Localhost)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-stock-dev-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Kafka Topics
app.kafka.topics.order-events=flashsale-order-events
app.kafka.topics.audit-events=flashsale.audit.events

# Elasticsearch Configuration (Localhost)
spring.elasticsearch.uris=http://localhost:9200

# Development Logging Levels (Detailed debugging output)
logging.level.root=INFO
logging.level.com.fahri.product=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
