services:
  # ============================================================================
  # 1. PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: flashsale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: product
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - flashsale-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis (In-Memory Data Grid, Cache-Aside & Atomic Stock Decrement)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: flashsale-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flashsale-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 3. Apache Kafka (KRaft Mode - Event-Driven Stream Engine, No Zookeeper needed)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: flashsale-kafka
    restart: unless-stopped
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - flashsale-network

  # ============================================================================
  # 4. Kafka UI (Visual Dashboard for Kafka Topics & Consumers)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flashsale-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080" # Access via http://localhost:8085
    environment:
      KAFKA_CLUSTERS_0_NAME: flashsale-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka
    networks:
      - flashsale-network

  # ============================================================================
  # 5. Elasticsearch (Full-Text Search Engine for Order & Product History)
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: flashsale-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms384m -Xmx384m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - flashsale-network

  # ============================================================================
  # 6. MongoDB (NoSQL Document Store for Raw Telemetry & Audit Logs)
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: flashsale-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: audit
    volumes:
      - mongo_data:/data/db
    networks:
      - flashsale-network

  # ============================================================================
  # 7. Product Microservice
  # ============================================================================
  product-service:
    build:
      context: ./product
      dockerfile: Dockerfile
    container_name: flashsale-product-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - flashsale-network
    profiles:
      - services
      - product
      - deploy
      - dev

  # ============================================================================
  # 8. Order Microservice
  # ============================================================================
  order-service:
    build:
      context: ./order
      dockerfile: Dockerfile
    container_name: flashsale-order-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - flashsale-network
    profiles:
      - services
      - order
      - deploy
      - dev

  # ============================================================================
  # 9. Audit Microservice
  # ============================================================================
  audit-service:
    build:
      context: ./audit
      dockerfile: Dockerfile
    container_name: flashsale-audit-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/audit
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mongodb:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - flashsale-network
    profiles:
      - services
      - audit
      - deploy
      - dev

networks:
  flashsale-network:
    name: flashsale-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  es_data:
  mongo_data:
