services:
  # ============================================================================
  # 1. PostgreSQL (RDBMS for Orders, Ledger, and Native SQL Queries)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: flashsale-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flashsale
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flashsale-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flashsale"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis (In-Memory Data Grid, Cache-Aside & Atomic Stock Decrement)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: flashsale-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - flashsale-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================================================
  # 3. Apache Kafka (KRaft Mode - Event-Driven Stream Engine, No Zookeeper needed)
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: flashsale-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - flashsale-network

  # ============================================================================
  # 4. Kafka UI (Visual Dashboard for Kafka Topics & Consumers)
  # ============================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flashsale-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080" # Access via http://localhost:8085
    environment:
      KAFKA_CLUSTERS_0_NAME: flashsale-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      - kafka
    networks:
      - flashsale-network

  # ============================================================================
  # 5. Elasticsearch (Full-Text Search Engine for Order & Product History)
  # ============================================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: flashsale-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms384m -Xmx384m
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - flashsale-network

  # ============================================================================
  # 6. MongoDB (NoSQL Document Store for Raw Telemetry & Audit Logs)
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: flashsale-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: audit
    volumes:
      - mongo_data:/data/db
    networks:
      - flashsale-network

networks:
  flashsale-network:
    name: flashsale-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  es_data:
  mongo_data:
