# ============================================================================
# Spring Profile: Production Deployment (Order Service)
# ============================================================================
spring.application.name=order
server.port=8082

# PostgreSQL Configuration for Docker / Deployment
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:order}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Optimized for Flash Sale High Concurrency)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# JPA & Hibernate Settings (Validation only, silence verbose SQL logs for performance)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Liquibase Database Migration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public

# Redis Configuration (In-Memory Data Grid & Cache-Aside)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Kafka Broker Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=flashsale-order-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Elasticsearch Configuration
spring.elasticsearch.uris=http://${ELASTICSEARCH_HOST:elasticsearch}:9200

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://${MONGO_HOST:mongodb}:27017/audit

# Logging Levels for Deployment
logging.level.root=INFO
logging.level.com.fahri.order=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
