# ============================================================================
# Spring Profile: Local Development (Order Service)
# ============================================================================
spring.application.name=order
server.port=8082

# Disable Spring Boot Docker Compose auto-binding to ensure explicit datasource URL
spring.docker.compose.enabled=false

# PostgreSQL Configuration (Localhost)
spring.datasource.url=jdbc:postgresql://localhost:5432/order
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool (Lightweight for local development)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA & Hibernate Settings (Verbose SQL formatting for development debugging)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase Database Migration
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.default-schema=public
spring.liquibase.liquibase-schema=public
logging.level.liquibase=INFO

# Redis Configuration (Localhost In-Memory Data Grid & Cache-Aside)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Kafka Broker (Localhost)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=flashsale-order-dev-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Elasticsearch Configuration (Localhost)
spring.elasticsearch.uris=http://localhost:9200

# MongoDB Configuration (Localhost)
spring.data.mongodb.uri=mongodb://localhost:27017/audit

# Development Logging Levels (Detailed debugging output)
logging.level.root=INFO
logging.level.com.fahri.order=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
